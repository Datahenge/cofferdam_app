[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cofferdam-app"
version = "0.1.0"
description = "Frappe app that routes native outbound calls through the cofferdam policy engine"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
maintainers = [{ name = "Brian Pond", email = "brian@datahenge.com" }]
keywords = [
    "frappe",
    "erpnext",
    "devops",
    "policy",
    "outbound",
    "safety",
    "staging",
    "sandbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cofferdam>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/datahenge/cofferdam-app"
Repository = "https://github.com/datahenge/cofferdam-app"
Issues = "https://github.com/datahenge/cofferdam-app/issues"

[tool.hatch.build.targets.wheel]
packages = ["cofferdam_app"]

[tool.hatch.build.targets.sdist]
include = ["cofferdam_app", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "frappe @ git+https://github.com/frappe/frappe@version-16",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["cofferdam_app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["cofferdam_app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
